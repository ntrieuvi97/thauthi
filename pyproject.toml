[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "overmind-os"
version = "0.1.0"
description = "The Self-Evolving Meta-Kernel for AI Coding Agents — Autopoietic Tool Forge, Darwinian Memory & Adversarial Verification powered by Centsible."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Overmind Contributors"}
]
keywords = ["ai-agents", "self-evolving", "autopoietic", "claude-code", "antigravity", "openclaw", "centsible", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.scripts]
overmind = "overmind.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["overmind*"]
