name: Thauthi 2.0 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package & pytest
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
      - name: Run Thauthi E2E Test Suite
        run: |
          python -m pytest tests/ -v --tb=short
      - name: Run Adversarial Shadow Verifier
        run: |
          thauthi verify --run-tests
      - name: Publish Thauthi Evolution Scorecard
        run: |
          thauthi scorecard --markdown >> "$GITHUB_STEP_SUMMARY"
